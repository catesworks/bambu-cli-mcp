name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact: bambu-cli-mcp-linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            artifact: bambu-cli-mcp-linux-arm64
            bun_args: --target=bun-linux-arm64
          - os: macos-latest
            target: darwin-x64
            artifact: bambu-cli-mcp-darwin-x64
            bun_args: --target=bun-darwin-x64
          - os: macos-latest
            target: darwin-arm64
            artifact: bambu-cli-mcp-darwin-arm64
          - os: windows-latest
            target: windows-x64
            artifact: bambu-cli-mcp-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build single-file executable
        run: bun build src/index.ts --compile --outfile ${{ matrix.artifact }} ${{ matrix.bun_args || '' }}

      - name: Verify binary exists
        shell: bash
        run: test -f "${{ matrix.artifact }}" && echo "OK: ${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/bambu-cli-mcp-linux-x64/bambu-cli-mcp-linux-x64 \
            artifacts/bambu-cli-mcp-linux-arm64/bambu-cli-mcp-linux-arm64 \
            artifacts/bambu-cli-mcp-darwin-x64/bambu-cli-mcp-darwin-x64 \
            artifacts/bambu-cli-mcp-darwin-arm64/bambu-cli-mcp-darwin-arm64 \
            artifacts/bambu-cli-mcp-windows-x64.exe/bambu-cli-mcp-windows-x64.exe
