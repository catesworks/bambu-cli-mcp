name: Deploy Docs
on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
concurrency:
  group: "docs-deploy"
  cancel-in-progress: false
jobs:
  deploy:
    runs-on:
      group: ci-runners
      labels: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: docs-site
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_ACCESS_TOKEN }}
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_ACCESS_TOKEN }}
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_ACCESS_TOKEN }}
